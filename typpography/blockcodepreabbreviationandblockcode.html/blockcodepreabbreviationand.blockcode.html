<!DOCTYPE html>
<html>
    <head>
        <title>
            Block Code, Pre, abbreviation and block code
        </title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    </head>
    <body>
        <h1> Abbreviations</h1>
        <p>
            <abbr title="Heer Dholariya">HD</abbr>
        </p>
        <h1> Blockquotes</h1>
        <blockquote class="blockquote">
            <p> Hello world</p>
            <footer class="blockquote-footer">By Heer</footer>
        </blockquote>
        <h1> multiple code lines</h1>
        <pre>
            What is your name?
            My name is Heer.
            How are you?
        </pre>
        <h1> Keyboard inputs</h1>
        <p>
            Use <kbd>ctrl+c</kbd> to copy the text
        </p>
    </body>
</html>
